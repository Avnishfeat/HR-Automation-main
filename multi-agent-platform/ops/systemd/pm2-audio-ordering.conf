# Install as: /etc/systemd/system/pm2-ai.service.d/audio.conf
# This deployment runs PM2 as a system service under User=ai (UID 1004).
[Unit]
Wants=network-online.target
After=network-online.target

[Service]
Environment=XDG_RUNTIME_DIR=/run/user/1004
Environment=PULSE_SERVER=unix:/run/user/1004/pulse/native
ExecStartPre=/home/ai/Kaivalya_Feat/HR-Automation-main/multi-agent-platform/ops/wait-for-pulse.sh
